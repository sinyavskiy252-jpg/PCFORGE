services:
  pcforge:
    build: .
    container_name: pcforge
    ports:
      - "5000:5000"
    environment:
      SQL_SERVER: "${SQL_SERVER_DOCKER:-host.docker.internal,1433}"
      SQL_DATABASE: "${SQL_DATABASE:-PCFORGE}"
      SQL_DRIVER: "ODBC Driver 18 for SQL Server"
      SQL_TRUSTED_CONNECTION: "no"
      SQL_USERNAME: "${SQL_USERNAME:-sa}"
      SQL_PASSWORD: "${SQL_PASSWORD:?Set SQL_PASSWORD in PowerShell before starting Docker}"
    restart: unless-stopped
